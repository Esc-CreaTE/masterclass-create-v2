<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Da el paso | CreaTE</title>

    <link rel="stylesheet" href="pago.css">
</head>

 <body>

    <main class="payment-page">

        <section class="payment-header">
            <p class="payment-eyebrow">DA EL PASO</p>

            <h1>Elige cómo quieres empezar.</h1>

            <p class="payment-subtitle">
                Dos caminos. Un mismo propósito: dejar de repetir lo que ya no quieres vivir y empezar a construir desde otro lugar.
            </p>
        </section>


        <section class="payment-options">

            <!-- ACÉRCATE -->

            <article class="payment-card">

                <p class="payment-phase">FASE 1</p>

                <h2>🌱 AcércaTE</h2>

                <div class="payment-price">
                    77 € <span>/ mes</span>
                </div>

                <div class="payment-terms">

                    <label>
                        <input type="checkbox" class="terms-checkbox">
                        <span>
                            He leído y acepto las
                            <a href="#" target="_blank">condiciones del servicio</a>
                            y la
                            <a href="#" target="_blank">política de privacidad</a>.
                        </span>
                    </label>

                </div>

                <a
                    href="TU_ENLACE_PAYPAL_ACERCATE"
                    class="payment-button disabled"
                    target="_blank"
                    aria-disabled="true"
                >
                    PAGAR CON PAYPAL
                </a>

            </article>


            <!-- RÍNDETE -->

            <article class="payment-card payment-card-featured">

                <p class="payment-phase">FASE 2</p>

                <h2>🕊 RíndeTE</h2>

                <div class="payment-price">
                    647 € <span>/ acceso durante 6 meses</span>
                </div>

                <div class="payment-terms">

                    <label>
                        <input type="checkbox" class="terms-checkbox">
                        <span>
                            He leído y acepto las
                            <a href="#" target="_blank">condiciones del servicio</a>
                            y la
                            <a href="#" target="_blank">política de privacidad</a>.
                        </span>
                    </label>

                </div>

                <div class="payment-buttons">

                    <a
                        href="TU_ENLACE_WISE"
                        class="payment-button disabled"
                        target="_blank"
                        aria-disabled="true"
                    >
                        PAGAR CON WISE
                    </a>

                    <a
                        href="TU_ENLACE_PAYPAL_RINDETE"
                        class="payment-button payment-button-secondary disabled"
                        target="_blank"
                        aria-disabled="true"
                    >
                        PAGAR CON PAYPAL
                    </a>

                </div>

            </article>

        </section>

    </main>


    <script>

        const cards = document.querySelectorAll(".payment-card");

        cards.forEach(card => {

            const checkbox = card.querySelector(".terms-checkbox");
            const buttons = card.querySelectorAll(".payment-button");

            checkbox.addEventListener("change", function () {

                buttons.forEach(button => {

                    if (this.checked) {

                        button.classList.remove("disabled");
                        button.removeAttribute("aria-disabled");

                    } else {

                        button.classList.add("disabled");
                        button.setAttribute("aria-disabled", "true");

                    }

                });

            });

        });

    </script>

</body>

</html>
